<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Demo · Seguimiento de proveedores · Teymasa</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1e22;--mut:#6a6f77;--line:#e5e5e0;--acc:#1f5eff;--ok:#18794a;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
nav{width:224px;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.brand{padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}.brand img{max-width:150px;max-height:52px;display:block}.brand small{display:block;color:var(--mut);font-size:12px;margin-top:8px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;font:inherit;color:var(--mut);cursor:pointer}
nav button.on{background:#eef2ff;color:var(--acc);font-weight:600}nav .n{font-size:12px;background:#fff2dc;color:var(--warn);border-radius:99px;padding:0 7px}
.brand.dk img{background:#2b2f36;padding:10px 12px;border-radius:8px}.by{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}.by img{height:20px}
main{flex:1;padding:24px 28px;max-width:1040px;min-width:0}.tag{font-size:12px;color:var(--mut);margin-bottom:12px}
h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 8px;font-size:14px}p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}.row:first-child{border-top:0}.row:hover{background:#fafaf8}
.grow{flex:1;min-width:0}.m{color:var(--mut);font-size:13px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:#efefea;color:var(--mut);white-space:nowrap}.pill.ok{background:#e4f4ea;color:var(--ok)}.pill.w{background:#fff2dc;color:var(--warn)}.pill.b{background:#fde8e6;color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.src{padding:16px;font-size:13.5px;line-height:1.55}.src .h{color:var(--mut);font-size:12px;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.wa{background:#e9f5e1;border-radius:10px;padding:8px 10px;margin:6px 0;max-width:90%}.pdf{border:1px solid var(--line);padding:12px;background:#fafafa}
mark{background:#fff0a8;border-radius:3px;padding:0 2px}mark.sel{outline:2px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px 10px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500;font-size:12px;border-top:0}
td input{font:inherit;width:84px;border:1px solid transparent;border-radius:6px;padding:2px 5px;margin:-3px -5px;background:transparent}td input:focus{border-color:var(--acc);outline:0;background:#fff}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}.back{color:var(--acc);cursor:pointer;margin-bottom:10px;display:inline-block}
.draft{padding:16px;white-space:pre-wrap;font-size:14px}.empty{padding:28px;text-align:center;color:var(--mut)}.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);padding:4px 12px;border-radius:99px;font-size:13px;cursor:pointer;color:var(--mut)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc{overflow-x:auto}
.nvb{display:block}@media(max-width:760px){.nvb{display:flex;gap:4px}nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:4px;padding:8px;overflow-x:auto}.brand{border:0;margin:0;padding:0 8px 0 0}.brand small,.by{display:none}.brand img{height:30px;max-width:90px}nav button{width:auto;white-space:nowrap;gap:6px}main{padding:14px}.split{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr;gap:8px}.kpi{padding:10px}.kpi b{font-size:20px}}
</style></head><body>
<nav><div class="brand dk"><img src="logo.svg" alt="Teymasa"><small>Demo de seguimiento de proveedores</small></div><div id="nv" class="nvb"></div><div class="by"><img src="automio.svg" alt="Automio"><span>Datos ficticios</span></div></nav>
<main id="m"></main>
<script>
const CFG={"title": "Confirmaciones sin doble tecleo", "intro": "Funciona junto a Business Central, sin sustituirlo: lee las confirmaciones y deja lo revisado listo para anotar en vuestro módulo de seguimiento.", "todayTitle": "Para revisar hoy", "inboxSub": "Confirmaciones de proveedor, leídas y comparadas con el pedido.", "supNote": "correo y PDF", "buyers": null, "extra": {"k": "bc", "label": "Para Business Central", "at": 3}, "orders": [{"po": "PO-5201", "sup": "Proveedor A", "ch": "Correo", "when": "hoy 09:05", "lines": [{"item": "Reductor", "pq": 6, "pd": "02/12", "cq": 6, "cd": "02/12"}], "buyer": null, "done": false}, {"po": "PO-5202", "sup": "Proveedor B", "ch": "Correo + PDF", "when": "hoy 08:30", "lines": [{"item": "Rodamiento", "pq": 40, "pd": "28/11", "cq": 40, "cd": "12/12"}], "buyer": null, "done": false}, {"po": "PO-5203", "sup": "Proveedor C", "ch": "Correo", "when": "ayer 16:45", "lines": [{"item": "Cable", "pq": 200, "pd": "05/12", "cq": 150, "cd": "05/12"}], "buyer": null, "done": false}, {"po": "PO-5204", "sup": "Proveedor A", "ch": "Correo + PDF", "when": "hace 2 días", "lines": [{"item": "Sensor", "pq": 12, "pd": "09/12", "cq": 12, "cd": "09/12"}], "buyer": null, "done": false}]};
const noteOf=o=>{const b=o.lines.filter(l=>l.cd!=l.pd||l.cq!=l.pq);return b.length?b.map(l=>l.item+": "+(l.cd!=l.pd?"entrega "+l.cd+" (pedida "+l.pd+")":"")+(l.cq!=l.pq?(l.cd!=l.pd?" y ":"")+l.cq+" uds (pedidas "+l.pq+")":"")).join("; "):"Coincide con el pedido"};
const D=CFG.orders;let S={v:'home',open:null,draft:[],chan:'Todos',buyer:'Todos',sup:null};
const $=s=>document.querySelector(s),m=$('#m');
const isDiff=o=>o.lines.some(l=>l.cd!=l.pd||l.cq!=l.pq);
const pend=()=>D.filter(o=>!o.done&&isDiff(o)),todo=()=>D.filter(o=>!o.done);
const V=[['home','Resumen'],['in','Confirmaciones',()=>todo().length],['ord','Pedidos'],['sup','Proveedores'],['out','Borradores',()=>S.draft.length]];if(CFG.extra)V.splice(CFG.extra.at,0,[CFG.extra.k,CFG.extra.label]);
function nav(v,x){S.v=v;S.open=null;if(x!=null)S.open=x;draw()}
function draw(){$('#nv').innerHTML=V.map(([k,l,f])=>`<button class="${S.v==k?'on':''}" onclick="nav('${k}')">${l}${f&&f()?`<span class="n">${f()}</span>`:''}</button>`).join('');({home,in:inbox,ord,sup:supp,out,bc:bcv,dir:dirv})[S.v]();window.scrollTo(0,0)}
function pillO(o){return o.done?'<span class="pill ok">Revisado</span>':isDiff(o)?'<span class="pill w">No coincide</span>':'<span class="pill">Por revisar</span>'}
function home(){const p=pend();m.innerHTML=`<div class="tag">Ejemplo con datos ficticios</div><h2>${CFG.title}</h2><p class="sub">${CFG.intro}</p>
<div class="kpis"><div class="kpi"><b>${todo().length}</b><span>confirmaciones por revisar</span></div><div class="kpi"><b>${p.length}</b><span>no coinciden con el pedido</span></div><div class="kpi"><b>${D.filter(o=>o.done).length}</b><span>revisadas</span></div></div>
<div class="card"><div class="row" style="cursor:default"><h3 style="margin:0">${CFG.todayTitle}</h3></div>${p.length?p.map(o=>`<div class="row" onclick="nav('in',${D.indexOf(o)})"><div class="grow"><b>${o.sup}</b> · ${o.po}<div class="m">${noteOf(o)}</div></div><span class="pill w">Revisar</span></div>`).join(''):'<div class="empty">Todo revisado.</div>'}</div>`}
function inbox(){if(S.open!=null)return rev(S.open);const chans=['Todos',...new Set(D.map(o=>o.ch))];let L=D.filter(o=>(S.chan=='Todos'||o.ch==S.chan)&&(S.buyer=='Todos'||o.buyer==S.buyer));
m.innerHTML=`<h2>Confirmaciones</h2><p class="sub">${CFG.inboxSub}</p><div class="chips">${chans.map(c=>`<span class="chip ${S.chan==c?'on':''}" onclick="S.chan='${c}';draw()">${c}</span>`).join('')}${CFG.buyers?CFG.buyers.map(b=>`<span class="chip ${S.buyer==b?'on':''}" onclick="S.buyer=S.buyer=='${b}'?'Todos':'${b}';draw()">${b}</span>`).join(''):''}</div>
<div class="card">${L.map(o=>`<div class="row" onclick="nav('in',${D.indexOf(o)})"><div class="grow"><b>${o.sup}</b> · ${o.po}<div class="m">${o.ch} · ${o.when}${o.buyer?' · '+o.buyer:''}</div></div>${pillO(o)}</div>`).join('')||'<div class="empty">Nada con este filtro.</div>'}</div>`}
function srcHtml(o){const l=o.lines;const hl=(t,k)=>`<mark id="h${k}">${t}</mark>`;
const body=l.map((x,k)=>`${x.item}: ${hl(x.cq+' uds',k+'q')}, entrega ${hl(x.cd,k+'d')}`);
if(o.ch=='WhatsApp')return `<div class="h">WhatsApp · ${o.sup} · ${o.when}</div><div class="wa">Hola, sobre el ${o.po}:<br>${body.join('<br>')}</div><div class="wa">Cualquier cosa nos decís.</div>`;
if(o.ch=='Llamada')return `<div class="h">Nota de llamada · ${o.sup} · ${o.when}</div>Nota: ${o.sup} confirma por teléfono.<br>${body.join('<br>')}`;if(o.ch.includes('PDF'))return `<div class="h">PDF adjunto · confirmacion_${o.po}.pdf</div><div class="pdf"><b>CONFIRMACIÓN DE PEDIDO ${o.po}</b><br><br>${body.join('<br>')}<br><br><span class="m">Documento simulado para la demo.</span></div>`;
return `<div class="h">Correo · ${o.sup} · ${o.when}</div>Asunto: Confirmación ${o.po}<br><br>Buenos días,<br>confirmamos el pedido ${o.po}:<br>${body.join('<br>')}<br><br>Saludos,<br>${o.sup}`}
function rev(i){const o=D[i];m.innerHTML=`<span class="back" onclick="nav('in')">← Confirmaciones</span><h2>${o.sup} · ${o.po}</h2><p class="sub">Se compara lo confirmado con lo que pediste. Nada se da por bueno sin tu revisión.</p>
<div class="split"><div class="card src">${srcHtml(o)}</div><div class="card sc"><table><tr><th>Artículo</th><th>Pedido</th><th>Confirmado</th><th></th></tr>${o.lines.map((l,k)=>{const dd=l.cd!=l.pd,dq=l.cq!=l.pq;return `<tr><td>${l.item}</td><td>${l.pq} uds<br><span class="m">${l.pd}</span></td><td><input value="${l.cq}" onfocus="hl('${k}q')"> uds<br><input value="${l.cd}" onfocus="hl('${k}d')"></td><td>${dd||dq?'<span class="pill w">'+(dd&&dq?'Fecha y cantidad':dd?'Fecha':'Cantidad')+'</span>':'<span class="pill ok">OK</span>'}</td></tr>`}).join('')}</table>
<div class="bar"><button class="btn" onclick="nav('in')">Dejar para luego</button>${isDiff(o)?`<button class="btn" onclick="mk(${i})">Preparar mensaje</button>`:''}<button class="btn p" onclick="D[${i}].done=true;nav('in')">Marcar revisado</button></div></div></div>`}
function hl(k){document.querySelectorAll('mark').forEach(x=>x.classList.remove('sel'));const e=document.getElementById('h'+k);if(e)e.classList.add('sel')}
function mk(i){const o=D[i];if(!S.draft.find(d=>d.i==i))S.draft.push({i,state:'draft'});nav('out')}
function ord(){m.innerHTML=`<h2>Pedidos</h2><p class="sub">Todos los pedidos abiertos y su estado tras revisar la confirmación.</p><div class="card sc"><table><tr><th>Pedido</th><th>Proveedor</th><th>Entrega pedida</th><th>Confirmada</th><th>Estado</th></tr>${D.map((o,i)=>`<tr style="cursor:pointer" onclick="nav('in',${i})"><td><b>${o.po}</b></td><td>${o.sup}</td><td>${o.lines[0].pd}</td><td>${o.lines[0].cd}</td><td>${pillO(o)}</td></tr>`).join('')}</table></div>`}
function supp(){if(S.sup){const s=S.sup,L=D.filter(o=>o.sup==s);m.innerHTML=`<span class="back" onclick="S.sup=null;draw()">← Proveedores</span><h2>${s}</h2><p class="sub">Resumen de sus pedidos y de lo que ha confirmado distinto.</p><div class="card">${L.map(o=>`<div class="row" onclick="nav('in',${D.indexOf(o)})"><div class="grow"><b>${o.po}</b><div class="m">${noteOf(o)}</div></div>${pillO(o)}</div>`).join('')}</div>`;return}
const names=[...new Set(D.map(o=>o.sup))];m.innerHTML=`<h2>Proveedores</h2><p class="sub">Un resumen por proveedor: cuántas confirmaciones no coinciden.</p><div class="card">${names.map(s=>{const L=D.filter(o=>o.sup==s),d=L.filter(isDiff).length;return `<div class="row" onclick="S.sup='${s}';draw()"><div class="grow"><b>${s}</b><div class="m">${L.length} pedidos · ${CFG.supNote}</div></div><span class="pill ${d?'w':'ok'}">${d?d+' no coinciden':'Sin incidencias'}</span></div>`}).join('')}</div>`}
function bcv(){const L=D.filter(o=>o.done);m.innerHTML=`<h2>Para Business Central</h2><p class="sub">Business Central sigue siendo vuestro sistema. Aquí queda lo ya revisado, listo para anotar en el módulo de seguimiento, sin teclear dos veces la lectura.</p><div class="card sc">${L.length?`<table><tr><th>Pedido</th><th>Proveedor</th><th>Fecha a anotar</th><th></th></tr>${L.map(o=>`<tr><td><b>${o.po}</b></td><td>${o.sup}</td><td>${o.lines.map(l=>l.item+': '+l.cd).join('<br>')}</td><td><button class="btn" onclick="this.outerHTML='<span class=pill>Copiado (simulación)</span>'">Copiar</button></td></tr>`).join('')}</table>`:'<div class="empty">Aún no hay nada revisado. Revisa una confirmación y aparecerá aquí.</div>'}</div>`}
function dirv(){const names=[...new Set(D.map(o=>o.sup))];const p=pend();m.innerHTML=`<h2>Resumen para dirección</h2><p class="sub">Una página fácil de reenviar al director de operaciones: qué pedidos van bien y cuáles no, sin abrir nada más.</p><div class="kpis"><div class="kpi"><b>${D.length}</b><span>pedidos seguidos</span></div><div class="kpi"><b>${p.length}</b><span>con incidencia</span></div><div class="kpi"><b>${D.length-p.length}</b><span>sin incidencia</span></div></div><div class="card sc"><table><tr><th>Proveedor</th><th>Pedidos</th><th>Incidencias</th></tr>${names.map(s=>{const L=D.filter(o=>o.sup==s);return `<tr><td><b>${s}</b></td><td>${L.length}</td><td>${L.filter(isDiff).map(o=>o.po+': '+noteOf(o)).join('<br>')||'<span class="pill ok">Ninguna</span>'}</td></tr>`}).join('')}</table><div class="bar"><button class="btn p" onclick="this.outerHTML='<span class=pill>Borrador de reenvío preparado (simulación, no se envía)</span>'">Preparar para reenviar</button></div></div>`}
function out(){if(!S.draft.length){m.innerHTML=`<h2>Borradores</h2><p class="sub">Mensajes a proveedor para revisar. No se envía nada hasta que lo apruebes.</p><div class="card empty">Ninguno. Abre una confirmación que no coincida y pulsa "Preparar mensaje".</div>`;return}
m.innerHTML=`<h2>Borradores</h2><p class="sub">Revisa y aprueba cada uno. En esta demo no se envía nada.</p>${S.draft.map((d,k)=>{const o=D[d.i],bad=o.lines.filter(l=>l.cd!=l.pd||l.cq!=l.pq);return `<div class="card"><div class="m" style="padding:12px 16px 0">Para: ${o.sup} · vía ${o.ch.includes('WhatsApp')?'WhatsApp':'correo'}</div><div class="draft">Hola,\n\nSobre el pedido ${o.po}: ${bad.map(l=>`${l.item}: ponéis ${l.cq} uds para el ${l.cd} y habíamos pedido ${l.pq} uds para el ${l.pd}`).join('; ')}.\n¿Podéis confirmarnos si se puede cumplir lo pedido?\n\nGracias.</div><div class="bar">${d.state=='draft'?`<button class="btn" onclick="S.draft.splice(${k},1);draw()">Descartar</button><button class="btn p" onclick="S.draft[${k}].state='ok';draw()">Aprobar</button>`:'<span class="pill ok">Aprobado (simulación, no se envía nada)</span>'}</div></div>`}).join('')}`}
draw()
</script></body></html>
